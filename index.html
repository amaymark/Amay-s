<script>

const textArray = [
"I build Trading Bots",
"I do Data Analysis",
"I study BBIT",
"I'm passionate about coding and trading",
"I'm a code wizard 🧙‍♂️"
];

let index = 0;
let charIndex = 0;
let currentText = "";
let isDeleting = false;

function typeEffect(){

currentText = textArray[index];

if(!isDeleting){
charIndex++;
}else{
charIndex--;
}

document.getElementById("typing").textContent = currentText.substring(0,charIndex);

if(!isDeleting && charIndex === currentText.length){
isDeleting = true;
setTimeout(typeEffect,1000);
return;
}

if(isDeleting && charIndex === 0){
isDeleting = false;
index++;

if(index === textArray.length){
index = 0;
}
}

setTimeout(typeEffect,100);
}

typeEffect();


const links = document.querySelectorAll(".nav-links a");

links.forEach(link => {
    link.addEventListener("click", function(){
        links.forEach(nav => nav.classList.remove("active"));
        this.classList.add("active");
    });
});
</script>
